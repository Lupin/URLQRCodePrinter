<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>URLQRCodePrinter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- `header`, `main` et `footer` sont de vrais repères : un utilisateur de
       lecteur d'écran navigue par région, pas dans un mur de `div`. La version
       précédente empilait deux `footer` de premier niveau — donc deux repères
       `contentinfo` concurrents — et n'avait aucun `main`. -->
  <header class="app-header">
    <div class="app-header__top">
      <h1 class="app-header__title">URLQRCodePrinter</h1>

      <!-- Sélecteur de langue : la première visite suit la langue du
           navigateur, puis le choix est mémorisé et partagé avec l'application
           embarquée et le service worker. -->
      <label class="locale">
        <span class="sr-only" data-i18n="Langue">Langue</span>
        <select id="locale" class="locale__select" data-i18n-aria-label="Langue" aria-label="Langue">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>

    <!-- Le compteur annonce « Liens enregistrés : 3 liens », pas « 3 ». Une
         région live qui ne dit qu'un nombre oblige à deviner de quoi on parle.
         `#count` reste seul porteur du chiffre : le libellé et l'unité vivent
         à côté, ce qui laisse le test vérifier « 0 » ou « 1 » sans unité. -->
    <p class="count" role="status" aria-live="polite" aria-atomic="true">
      <span id="count-label" class="sr-only" data-i18n="Liens enregistrés :">Liens enregistrés :</span>
      <span id="count" class="count__value">0</span>
      <span id="count-unit" class="count__unit">lien</span>
    </p>
  </header>

  <main class="app-main">
    <section class="capture" aria-labelledby="capture-title">
      <h2 id="capture-title" class="sr-only" data-i18n="Ajouter la page courante">Ajouter la page courante</h2>
      <p id="current-tab" class="capture__page" title="">Chargement…</p>
      <button id="add-current" class="btn btn--primary" type="button" disabled
              data-i18n="Ajouter cette page">
        Ajouter cette page
      </button>
    </section>

    <!-- Rappel de la mention, tant qu'elle n'a pas été acceptée.
         La collecte est verrouillée dans `popup.js` comme dans le service
         worker ; cet encart existe pour que le verrou soit **expliqué** plutôt
         que subi : sans lui, « Ajouter cette page » ouvrirait un onglet sans
         raison apparente. -->
    <section id="consent-notice" class="notice" aria-labelledby="consent-notice-title" hidden>
      <h2 id="consent-notice-title" class="sr-only" data-i18n="Confidentialité">Confidentialité</h2>
      <p class="notice__text"
         data-i18n="Avant d'enregistrer un lien, lisez la mention de confidentialité.">
        Avant d'enregistrer un lien, lisez la mention de confidentialité.
      </p>
      <button id="open-privacy" class="btn btn--neutral" type="button" data-i18n="Lire la mention">
        Lire la mention
      </button>
    </section>

    <section class="collection" aria-labelledby="collection-title">
      <h2 id="collection-title" class="section-title" data-i18n="Liens enregistrés">Liens enregistrés</h2>
      <ul id="list" class="list" aria-labelledby="collection-title"></ul>
      <!-- Masqué au départ : laisser ce message visible pendant le chargement
           afficherait « Aucun lien » à quelqu'un qui en a. -->
      <p id="empty" class="empty" hidden>
        <span data-i18n="Aucun lien pour l'instant.">Aucun lien pour l'instant.</span><br>
        <span data-i18n="Utilisez le clic droit sur une page ou un lien.">Utilisez le clic droit sur une page ou un lien.</span>
      </p>
    </section>

    <!-- Région dédiée à l'échec de démarrage. Elle portait auparavant le texte
         dans la zone « liste vide », sans rôle : rien n'était annoncé. -->
    <p id="startup-error" class="alert" role="alert" hidden></p>
  </main>

  <footer class="app-footer">
    <!-- Le message transitoire est ancré au-dessus du pied : il ne recouvre
         jamais les boutons sur lesquels l'utilisateur s'apprête à cliquer. -->
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Rempli, mais à l'encre et non à l'accent : deux boutons pleins de
         couleurs différentes mettraient deux accents à l'écran. L'orange ne
         désigne donc qu'une seule chose — ajouter la page courante. -->
    <button id="open-app" class="btn btn--neutral" type="button" disabled
            data-i18n="Voir les QR codes">
      Voir les QR codes
    </button>

    <div class="app-footer__row">
      <button id="export-csv" class="btn btn--ghost" type="button" disabled>CSV</button>
      <button id="export-md" class="btn btn--ghost" type="button" disabled>Markdown</button>
      <button id="clear" class="btn btn--ghost btn--danger" type="button" disabled
              data-i18n="Tout effacer">
        Tout effacer
      </button>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
